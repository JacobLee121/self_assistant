[project]
name = "self-assistant"
version = "0.2.0"
description = "A general-purpose AI assistant using Google ADK + DeepSeek API with local MCP servers for extensible tool capabilities"
requires-python = ">=3.10"
dependencies = [
    "google-adk>=1.0.0",
    "litellm>=1.0.0",
    "python-dotenv>=1.0.0",
    "mcp>=1.0.0",
    "langfuse>=4.7.0",
    "opentelemetry-api>=1.36,<=1.41.1",
    "opentelemetry-sdk>=1.36,<=1.41.1",
    "opentelemetry-exporter-otlp-proto-http>=1.36,<=1.41.1",
]

[tool.setuptools]
py-modules = ["agent"]
